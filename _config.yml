theme: minima
title: Shihab Ahmed
description: Shihab Ahmed is a PhD candidate in mechanical engineering at UC Merced who uses reactive molecular dynamics and machine learning to study lubricant oxidation and antioxidant additives.
url: https://sahmed73.github.io
baseurl: ""
lang: en
timezone: America/Los_Angeles

author: Shihab Ahmed
email: sahmed73@ucmerced.edu

header_pages:
  - publications.md
  - research.md
  # Published from the separate sahmed73/molecule-viewer repository.
  - title: Molecule viewer
    url: /molecule-viewer/
  - blog.md
  - digest.md

# Research digest: daily AI-written paper summaries in _digest/ (see scripts/digest/README.md).
collections:
  digest:
    output: true
    permalink: /digest/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: digest
    values:
      layout: digest
      author: Written by AI
      reading_time: 2

feed:
  collections:
    digest:
      path: /digest/feed.xml

plugins:
  - jekyll-feed
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - workers
  - rdkit-api
  - render.yaml

github_username: sahmed73
linkedin_username: shihab73
orcid: 0009-0006-8230-9141
web_of_science_id: JWO-9574-2024
# Leave empty to hide the link.
google_scholar: ""
cv: /assets/Shihab_Ahmed_CV.pdf
# Private stats page (/stats/) reads visit data from this Cloudflare Worker.
stats_api: https://site-stats.site-stats.workers.dev
