services:
  - type: web
    name: sahmed73-molecule-rdkit
    runtime: python
    plan: free
    rootDir: rdkit-api
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
