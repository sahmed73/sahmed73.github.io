<header class="site-header">
  <div class="wrapper header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">Shihab Ahmed</a>
    <nav class="site-nav" aria-label="Main navigation">
      {% for path in site.header_pages %}
        {% if path.url %}
        <a href="{{ path.url | relative_url }}"{% if page.url == path.url %} aria-current="page"{% endif %}>{{ path.title }}</a>
        {% else %}
        {% assign nav_page = site.pages | where: 'path', path | first %}
        <a href="{{ nav_page.url | relative_url }}"{% if page.url == nav_page.url or page.layout == 'post' and path == 'blog.md' %} aria-current="page"{% endif %}>{{ nav_page.nav_title | default: nav_page.title }}</a>
        {% endif %}
      {% endfor %}
      {% if site.cv != "" %}<a href="{{ site.cv | relative_url }}">CV</a>{% endif %}
    </nav>
  </div>
</header>
