<header class="site-header">
  <div class="wrapper header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}" aria-label="Shihab Ahmed, home"><span class="monogram" aria-hidden="true">sa.</span> Shihab Ahmed</a>
    <nav class="site-nav" aria-label="Main navigation">
      {% for path in site.header_pages %}
        {% assign nav_page = site.pages | where: 'path', path | first %}
        <a class="page-link" href="{{ nav_page.url | relative_url }}"{% if page.url == nav_page.url or page.layout == 'post' and path == 'blog.md' %} aria-current="page"{% endif %}>{{ nav_page.nav_title | default: nav_page.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
